<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>MARKET PRO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@ericblade/quagga2@1.8.2/dist/quagga.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        :root {
            --bg-deep: #e0f2fe;
            --bg-card: rgba(255, 255, 255, 0.82);
            --glass-border: rgba(0, 0, 0, 0.08);
            --text-primary: #0f172a;
            --text-secondary: #475569;
        }
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui,-apple-system,sans-serif}
        body{background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 50%, #e0f2fe 100%);display:flex;justify-content:center;min-height:100vh;padding:12px;color:var(--text-primary)}
        .app-container{max-width:550px;width:100%;background:var(--bg-card);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:32px;padding:16px 18px;border:1px solid var(--glass-border);box-shadow:0 25px 50px -12px rgba(0,0,0,0.15);animation:fadeInUp 0.5s ease}
        .result-area{background: linear-gradient(145deg, rgba(224,242,254,0.9), rgba(191,219,254,0.95));backdrop-filter:blur(12px);border-radius:28px;padding:24px;text-align:center;margin-bottom:14px;min-height:185px;border:1px solid var(--glass-border);position:relative;box-shadow:inset 0 1px 0 rgba(255,255,255,0.05);transition:all 0.3s ease}
        .result-placeholder{color:var(--text-secondary);font-size:1.1rem;font-weight:600;letter-spacing:0.5px}
        .result-price{font-size:2.6rem;font-weight:900;color:#f87171;margin:10px 0;font-family:'Outfit',sans-serif;text-shadow:0 2px 10px rgba(248,113,113,0.25)}
        .result-name{font-size:1.3rem;font-weight:800;color:#fdba74;text-transform:uppercase;margin-bottom:6px;font-family:'Outfit',sans-serif;letter-spacing:0.5px}
        .product-image{max-width:100%;max-height:150px;border-radius:20px;margin:12px auto;display:block;object-fit:contain;box-shadow:0 8px 24px rgba(0,0,0,0.3)}
        .close-result-btn{position:absolute;top:12px;right:14px;background:rgba(239,68,68,0.9);color:white;border:none;border-radius:50%;width:34px;height:34px;font-size:16px;font-weight:bold;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;backdrop-filter:blur(4px)}
        .close-result-btn:hover{transform:scale(1.1);background:rgba(239,68,68,1)}
        .btn{border:none;border-radius:60px;padding:18px 12px;color:white;font-weight:800;cursor:pointer;text-transform:uppercase;font-size:0.9rem;letter-spacing:0.5px;margin-top:6px;transition:all 0.2s cubic-bezier(0.4,0,0.2,1);border:1px solid rgba(255,255,255,0.1);position:relative;overflow:hidden}
        .btn::before{content:'';position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(180deg,rgba(255,255,255,0.15),transparent);opacity:0.5;pointer-events:none}
        .btn:active{transform:scale(0.96)}
        .btn:hover{transform:translateY(-2px);box-shadow:0 10px 25px -5px rgba(0,0,0,0.3)}
        .btn-primary{background:linear-gradient(135deg,#6366f1,#4f46e5);box-shadow:0 4px 15px rgba(99,102,241,0.35)}
        .btn-success{background:linear-gradient(135deg,#f97316,#ea580c);box-shadow:0 4px 15px rgba(249,115,22,0.35)}
        .button-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:12px 0}
        .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15,23,42,0.92);backdrop-filter:blur(8px);justify-content:center;align-items:center;z-index:1000;animation:fadeIn 0.2s ease}
        .modal-content{background:linear-gradient(145deg,rgba(255,255,255,0.95),rgba(241,245,249,0.98));width:92%;max-width:550px;border-radius:32px;padding:24px;max-height:88%;overflow-y:auto;color:var(--text-primary);border:1px solid var(--glass-border);box-shadow:0 25px 50px -12px rgba(0,0,0,0.15);animation:slideUp 0.35s cubic-bezier(0.16,1,0.3,1)}
        .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid rgba(0,0,0,0.06)}
        .modal-title{color:#f87171;font-weight:900;font-size:1.3rem;font-family:'Outfit',sans-serif;letter-spacing:0.5px;display:flex;align-items:center;gap:8px}
        .close-modal-btn{background:rgba(239,68,68,0.15);color:#f87171;padding:8px 18px;border-radius:40px;font-size:0.85rem;cursor:pointer;border:1px solid rgba(239,68,68,0.2);font-weight:700;transition:all 0.2s}
        .close-modal-btn:hover{background:rgba(239,68,68,0.25)}
        .inventory-search input{width:100%;padding:12px 18px;border-radius:60px;border:none;background:rgba(224,242,254,0.7);color:var(--text-primary);font-size:0.95rem;margin-bottom:14px;border:1px solid rgba(0,0,0,0.08);transition:all 0.2s}
        .inventory-search input:focus{outline:none;background:rgba(255,255,255,0.1);border-color:rgba(59,130,246,0.4);box-shadow:0 0 0 3px rgba(59,130,246,0.1)}
        .product-list-simple{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow-y:auto;padding-right:4px}
        .envanter-item{background:rgba(224,242,254,0.65);border-radius:24px;padding:8px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;transition:all 0.2s ease;border:1px solid transparent}
        .envanter-item:hover{background:rgba(255,255,255,0.08);transform:translateX(4px);border-color:rgba(255,255,255,0.06)}
        .product-name-item{flex:1;cursor:pointer;font-weight:700;font-size:0.88rem;padding:6px 2px;letter-spacing:0.2px}
        .btn-add-queue-list{background:linear-gradient(135deg,#f59e0b,#d97706);border:none;border-radius:40px;padding:7px 14px;color:white;font-weight:700;font-size:0.72rem;cursor:pointer;box-shadow:0 2px 8px rgba(245,158,11,0.25);transition:all 0.2s}
        .btn-add-queue-list:hover{transform:scale(1.05)}
        .expiry-red{background:linear-gradient(135deg,#fecaca,#fca5a5)!important;border:2px solid #ef4444!important}
        .expiry-yellow{background:linear-gradient(135deg,#fde68a,#fcd34d)!important;border:2px solid #f59e0b!important}
        .expiry-green{background:linear-gradient(135deg,#a7f3d0,#6ee7b7)!important;border:2px solid #10b981!important}
        .expiry-zero-stock{background:linear-gradient(135deg,#e2e8f0,#cbd5e1)!important;border:2px solid #64748b!important;opacity:1}
        .expiry-no-date{background:linear-gradient(135deg,#ddd6fe,#c4b5fd)!important;border:2px solid #8b5cf6!important}
        .hidden{display:none}
        #toast-container{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:10px}
        .toast{background:linear-gradient(135deg,rgba(224,242,254,0.95),rgba(191,219,254,0.98));color:var(--text-primary);padding:14px 24px;border-radius:40px;box-shadow:0 10px 30px rgba(0,0,0,0.15);font-size:0.9rem;font-weight:600;border:1px solid var(--glass-border);backdrop-filter:blur(12px);animation:slideInRight 0.4s cubic-bezier(0.16,1,0.3,1),fadeOut 0.5s ease 2.5s forwards;pointer-events:none;display:flex;align-items:center;gap:10px}
        @keyframes fadeIn{from{opacity:0}to{opacity:1}}
        @keyframes slideUp{from{opacity:0;transform:translateY(30px) scale(0.97)}to{opacity:1;transform:translateY(0) scale(1)}}
        @keyframes fadeInUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
        @keyframes slideInRight{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
        @keyframes fadeOut{to{opacity:0;visibility:hidden}}
        @keyframes scanMove{0%,100%{top:20%;opacity:0.6}50%{top:80%;opacity:1}}
        #liveClock{background:linear-gradient(135deg,rgba(15,23,42,0.8),rgba(30,41,59,0.9));color:#34d399;padding:8px 14px;border-radius:16px;font-family:'Outfit',monospace;font-weight:800;font-size:0.85rem;letter-spacing:2px;border:1px solid rgba(52,211,153,0.2);box-shadow:0 0 20px rgba(52,211,153,0.15);min-width:84px;text-align:center;white-space:nowrap}
        #liveClock .clock-date{display:block;font-size:0.6rem;color:#10b981;letter-spacing:1px;margin-top:2px;font-weight:600}
        .app-header-title{font-family:'Outfit',sans-serif;font-size:1.5rem;font-weight:900;background:linear-gradient(135deg,#f87171,#fdba74);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1px}
        .nav-card{background:linear-gradient(135deg,#3b82f6,#2563eb);border:1px solid rgba(59,130,246,0.3);border-radius:18px;padding:12px 20px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:all 0.3s ease;margin-top:12px}
        .nav-card:hover{transform:translateY(-2px);background:linear-gradient(135deg,#2563eb,#1d4ed8);box-shadow:0 10px 25px -5px rgba(59,130,246,0.3)}
        .nav-card .nav-title{font-size:0.9rem;font-weight:800;color:#ffffff;letter-spacing:0.5px}
        .nav-card .nav-badge{background:rgba(255,255,255,0.25);border-radius:20px;padding:4px 14px;font-size:0.8rem;font-weight:800;color:#ffffff}
        .menu-btn{background:rgba(255,255,255,0.06);border:none;border-radius:16px;padding:12px 18px;cursor:pointer;font-size:1.3rem;color:var(--text-primary);justify-self:start;transition:all 0.2s;border:1px solid rgba(255,255,255,0.08)}
        .menu-btn:hover{background:rgba(255,255,255,0.12);transform:scale(1.05)}
        .drawer-btn{background:rgba(224,242,254,0.7);border:none;border-radius:40px;padding:14px 18px;color:var(--text-primary);font-weight:700;font-size:0.9rem;cursor:pointer;text-align:left;width:100%;transition:all 0.2s;border:1px solid transparent;display:flex;align-items:center;gap:10px}
        .drawer-btn:hover{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.08);transform:translateX(4px)}
        .drawer-group-title{font-size:0.65rem;font-weight:800;color:var(--text-secondary);letter-spacing:2px;text-transform:uppercase;padding:6px 8px 4px}
        .drawer-sep{height:1px;background:rgba(0,0,0,0.06);margin:6px 0}
        .product-detail-card{border-radius:32px;padding:24px;text-align:center;font-size:1rem;background:rgba(224,242,254,0.6);border:1px solid rgba(255,255,255,0.05)}
        .detail-image{max-width:100%;max-height:180px;border-radius:24px;margin:14px auto;display:block;box-shadow:0 12px 32px rgba(0,0,0,0.3)}
        input,select{width:100%;padding:16px 20px;border-radius:60px;border:none;background:rgba(224,242,254,0.7);color:var(--text-primary);font-size:0.95rem;margin:10px 0;border:1px solid rgba(0,0,0,0.08);transition:all 0.2s}
        input:focus,select:focus{outline:none;background:rgba(255,255,255,0.1);border-color:rgba(59,130,246,0.4);box-shadow:0 0 0 3px rgba(59,130,246,0.1)}
    </style>
</head>
<body>

<div id="drawerOverlay" onclick="closeDrawer()" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(15,23,42,0.7);backdrop-filter:blur(4px);z-index:500;"></div>
<div id="drawer" style="position:fixed;top:0;left:-255px;width:245px;height:100%;background:linear-gradient(180deg,#f0f9ff,#e0f2fe);z-index:600;transition:left 0.35s cubic-bezier(0.16,1,0.3,1);box-shadow:8px 0 32px rgba(0,0,0,0.15);border-radius:0 32px 32px 0;border-right:1px solid rgba(0,0,0,0.06)">
    <div style="background:rgba(255,255,255,0.5);padding:52px 24px 24px;border-radius:0 32px 0 0;border-bottom:1px solid rgba(0,0,0,0.06)">
        <div style="font-size:1.6rem;font-weight:900;color:#fdba74;font-family:'Outfit',sans-serif;letter-spacing:0.5px"><i class="fa-solid fa-basket-shopping" style="margin-right:8px"></i>MARKET PRO</div>
        <div style="font-size:0.75rem;color:var(--text-secondary);margin-top:6px;font-weight:500">Envanter Yonetimi</div>
    </div>
    <div style="padding:16px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;max-height:calc(100vh - 140px)">
        <div class="drawer-group-title"><i class="fa-solid fa-boxes-stacked" style="margin-right:6px"></i>ENVANTER</div>
        <button class="drawer-btn" onclick="closeDrawer();openStokSayimModal();"><i class="fa-solid fa-calculator" style="width:20px;text-align:center"></i> STOK SAYIM MODU</button>
        <div class="drawer-sep"></div>
        <div class="drawer-group-title"><i class="fa-solid fa-tags" style="margin-right:6px"></i>ETIKETLER</div>
        <button class="drawer-btn" onclick="closeDrawer();managePrintQueue();"><i class="fa-solid fa-list-check" style="width:20px;text-align:center"></i> ETIKET LISTESINI YONET</button>
        <div class="drawer-sep"></div>
        <div class="drawer-group-title"><i class="fa-solid fa-cloud-arrow-down" style="margin-right:6px"></i>YEDEKLEME</div>
        <button class="drawer-btn" onclick="closeDrawer();backupData();"><i class="fa-solid fa-download" style="width:20px;text-align:center"></i> TELEFONA YEDEK AL</button>
        <button class="drawer-btn" onclick="closeDrawer();restoreData();"><i class="fa-solid fa-upload" style="width:20px;text-align:center"></i> YEDEKTEN GERI YUKLE</button>
        <div class="drawer-sep"></div>
        <div class="drawer-group-title"><i class="fa-solid fa-chart-pie" style="margin-right:6px"></i>RAPORLAR</div>
        <button class="drawer-btn" onclick="closeDrawer();exportToCSV();"><i class="fa-solid fa-file-csv" style="width:20px;text-align:center"></i> CSV RAPORU INDIR</button>
    </div>
</div>

<div class="app-container">
    <div style="display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:6px;margin-bottom:14px">
        <button onclick="openDrawer()" class="menu-btn"><i class="fa-solid fa-bars"></i></button>
        <div style="text-align:center" class="app-header-title">MARKET PRO</div>
        <div id="liveClock"><span id="clockTime">--:--:--</span><span class="clock-date" id="clockDate">--/--</span></div>
    </div>
    
    <div class="result-area" id="resultArea">
        <div class="result-placeholder"><i class="fa-solid fa-camera" style="margin-right:8px"></i>BARKOD OKUTUN</div>
    </div>
    
    <div class="button-grid">
        <button class="btn btn-primary" id="searchBtn"><i class="fa-solid fa-magnifying-glass" style="margin-right:6px"></i>SORGULA</button>
        <button class="btn btn-primary" id="addBtn"><i class="fa-solid fa-plus" style="margin-right:6px"></i>URUN EKLE</button>
    </div>
    <div class="button-grid">
        <button class="btn btn-success" id="productSearchBtn"><i class="fa-solid fa-box" style="margin-right:6px"></i>URUN ARA</button>
        <button class="btn btn-success" id="manualAddBtn"><i class="fa-solid fa-pen-to-square" style="margin-right:6px"></i>MANUEL EKLE</button>
    </div>
    
    <div onclick="openInventoryModal()" class="nav-card">
        <div class="nav-title"><i class="fa-solid fa-clipboard-list" style="margin-right:8px"></i>ENVANTERI GORUNTULE</div>
        <div id="productCountBadge" class="nav-badge">0 cesit</div>
    </div>
</div>

<div id="toast-container"></div>

<!-- Kamera Modal -->
<div id="cameraModal" class="modal" style="justify-content:center;align-items:center;flex-direction:column;background:rgba(15,23,42,0.95)">
    <div style="width:92%;max-width:520px;background:linear-gradient(180deg,#1e293b,#0f172a);border-radius:32px;overflow:hidden;box-shadow:0 25px 60px rgba(0,0,0,0.6);border:2px solid rgba(99,102,241,0.3);position:relative">
        <div style="position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#6366f1,#ec4899,#f59e0b);z-index:10"></div>
        <div style="position:relative;padding:12px;background:rgba(0,0,0,0.3)">
            <div style="display:flex;align-items:center;justify-content:space-between;padding:0 8px 8px">
                <div style="color:#94a3b8;font-size:0.8rem;font-weight:700;letter-spacing:1px"><i class="fa-solid fa-barcode" style="margin-right:6px;color:#6366f1"></i>BARKOD TARAYICI</div>
                <div id="cameraModalStatus" style="color:#34d399;font-size:0.75rem;font-weight:700">HAZIR</div>
            </div>
            <div style="position:relative;border-radius:20px;overflow:hidden;border:2px solid rgba(99,102,241,0.4);background:#000">
                <video id="cameraVideo" autoplay muted playsinline style="width:100%;display:block;min-height:280px;background:#000"></video>
                <div id="scanLine" style="position:absolute;top:30%;left:5%;right:5%;height:2px;background:linear-gradient(90deg,transparent,#6366f1,transparent);box-shadow:0 0 12px rgba(99,102,241,0.6);animation:scanMove 2s ease-in-out infinite;opacity:0"></div>
            </div>
        </div>
        <div style="padding:16px;display:flex;gap:12px;justify-content:center">
            <button id="closeCameraModalBtn" style="background:linear-gradient(135deg,#ef4444,#dc2626);border:none;border-radius:40px;padding:12px 28px;color:white;font-weight:800;font-size:0.9rem;cursor:pointer;box-shadow:0 4px 15px rgba(239,68,68,0.3);transition:all 0.2s"><i class="fa-solid fa-xmark" style="margin-right:6px"></i>KAPAT</button>
        </div>
    </div>
</div>

<!-- Envanter Modal -->
<div id="inventoryModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <span class="modal-title"><i class="fa-solid fa-boxes-stacked" style="margin-right:8px"></i>ENVANTER</span>
            <button class="close-modal-btn" onclick="closeInventoryModal()"><i class="fa-solid fa-xmark" style="margin-right:4px"></i>KAPAT</button>
        </div>
        <div class="inventory-search"><input type="text" id="inventorySearchInput" placeholder="Urun adi veya barkod ara..." autocomplete="off" oninput="renderInventoryList()"></div>
        <div id="modalProductList" class="product-list-simple"></div>
    </div>
</div>

<!-- Ürün Detay Modal -->
<div id="productDetailModal" class="modal">
    <div class="modal-content" id="productDetailContent"></div>
</div>

<!-- Manuel Ekleme Modal -->
<div id="manualAddModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <span class="modal-title"><i class="fa-solid fa-pen-to-square" style="margin-right:8px"></i>MANUEL URUN EKLE</span>
            <button class="close-modal-btn" onclick="closeManualAddModal()"><i class="fa-solid fa-xmark" style="margin-right:4px"></i>KAPAT</button>
        </div>
        <div id="manualAddFormContainer"></div>
    </div>
</div>

<!-- Etiket Listesi Modal -->
<div id="queueModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <span class="modal-title"><i class="fa-solid fa-tags" style="margin-right:8px"></i>ETIKET LISTESI</span>
            <button class="close-modal-btn" onclick="closeQueueModal()"><i class="fa-solid fa-xmark" style="margin-right:4px"></i>KAPAT</button>
        </div>
        <div id="queueListContainer" style="max-height:50vh;overflow-y:auto"></div>
        <div style="margin-top:18px">
            <button class="btn btn-primary" style="width:100%;background:linear-gradient(135deg,#ef4444,#dc2626)!important" onclick="clearPrintQueue()"><i class="fa-solid fa-trash-can" style="margin-right:8px"></i>LISTEYI TEMIZLE</button>
        </div>
    </div>
</div>

<!-- Stok Sayım Modal -->
<div id="stokSayimModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <span class="modal-title"><i class="fa-solid fa-calculator" style="margin-right:8px"></i>STOK SAYIM</span>
            <button class="close-modal-btn" onclick="closeStokSayimModal()"><i class="fa-solid fa-xmark" style="margin-right:4px"></i>KAPAT</button>
        </div>
        <div style="font-size:0.8rem;color:var(--text-secondary);margin-bottom:10px;font-weight:500">Sayilan miktari girin, fark otomatik hesaplanir.</div>
        <input type="text" id="sayimSearchInput" placeholder="Urun ara..." style="margin-bottom:10px" oninput="renderSayimListe()">
        <div id="sayimListeItems" style="max-height:42vh;overflow-y:auto"></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px">
            <button onclick="saveSayimListe()" style="background:linear-gradient(135deg,#10b981,#059669);border:none;border-radius:40px;padding:16px;color:white;font-weight:800;cursor:pointer;"><i class="fa-solid fa-floppy-disk" style="margin-right:6px"></i>GUNCELLE</button>
            <button onclick="closeStokSayimModal()" style="background:linear-gradient(135deg,#64748b,#475569);border:none;border-radius:40px;padding:16px;color:white;font-weight:800;cursor:pointer;"><i class="fa-solid fa-xmark" style="margin-right:6px"></i>KAPAT</button>
        </div>
    </div>
</div>

<script>
// ============ ANA DEĞİŞKENLER ============
let db = null;
let products = [];
let printQueue = [];
let currentStream = null;
let lastScannedProduct = null;
let quaggaActive = false;
let tempImageData = null;
let currentEditingProductId = null;

// ============ SES ============
function playBeep() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 1200;
        gain.gain.value = 0.12;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        setTimeout(() => { try { osc.stop(); } catch(e) {} }, 100);
    } catch(e) {}
}

// ============ INDEXEDDB ============
function openIndexedDB() {
    return new Promise((resolve, reject) => {
        const request = indexedDB.open("MarketProDB", 1);
        request.onerror = () => reject(request.error);
        request.onsuccess = () => { db = request.result; resolve(db); };
        request.onupgradeneeded = (event) => {
            const dbRef = event.target.result;
            if (!dbRef.objectStoreNames.contains("products")) dbRef.createObjectStore("products", { keyPath: "id" });
            if (!dbRef.objectStoreNames.contains("metadata")) dbRef.createObjectStore("metadata", { keyPath: "key" });
        };
    });
}

async function loadProductsFromIDB() {
    if (!db) await openIndexedDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(["products"], "readonly");
        const store = tx.objectStore("products");
        const request = store.getAll();
        request.onsuccess = () => resolve(request.result || []);
        request.onerror = () => reject(request.error);
    });
}

async function saveProductsToIDB(prods) {
    if (!db) await openIndexedDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(["products"], "readwrite");
        const store = tx.objectStore("products");
        store.clear();
        for (let p of prods) store.put(p);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
    });
}

async function saveMetadata(key, value) {
    if (!db) await openIndexedDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(["metadata"], "readwrite");
        const store = tx.objectStore("metadata");
        store.put({ key: key, value: value });
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
    });
}

async function loadMetadata(key) {
    if (!db) await openIndexedDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(["metadata"], "readonly");
        const store = tx.objectStore("metadata");
        const req = store.get(key);
        req.onsuccess = () => resolve(req.result ? req.result.value : null);
        req.onerror = () => reject(req.error);
    });
}

function showToast(msg) {
    const c = document.getElementById("toast-container");
    const t = document.createElement("div");
    t.className = "toast";
    t.innerHTML = `<i class="fa-solid fa-circle-info" style="color:#60a5fa"></i> ${msg}`;
    c.appendChild(t);
    setTimeout(() => t.remove(), 3000);
}

function escapeHtml(s) { if(!s) return ''; return s.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]); }

function normBarcode(b) { return (b===null||b===undefined)?'':String(b).replace(/\s/g,'').trim(); }

function findByBarcode(code) {
    let c = normBarcode(code);
    if(!c || c.length < 3) return null;
    let f = products.find(p => normBarcode(p.barcode) === c);
    if(f) return f;
    let cNoZero = c.replace(/^0+/,'');
    f = products.find(p => normBarcode(p.barcode).replace(/^0+/,'') === cNoZero);
    return f || null;
}

function getProductColorClass(p) {
    if(p.quantity === 0) return "expiry-zero-stock";
    if(!p.expiry) return "expiry-no-date";
    let d = Math.ceil((new Date(p.expiry) - new Date()) / 86400000);
    if(isNaN(d)) return "expiry-no-date";
    if(d <= 7) return "expiry-red";
    if(d <= 14) return "expiry-yellow";
    return "expiry-green";
}

function getCategoryEmoji(cat) {
    return cat === "Dolap Urunleri" ? "<i class='fa-solid fa-jar' style='margin-left:6px;opacity:0.7'></i>" :
           cat === "Kuru Gida" ? "<i class='fa-solid fa-wheat-awn' style='margin-left:6px;opacity:0.7'></i>" :
           "<i class='fa-solid fa-box' style='margin-left:6px;opacity:0.7'></i>";

// ============ KAMERA ============
async function openCameraModal(mode) {
    const modal = document.getElementById("cameraModal");
    const video = document.getElementById("cameraVideo");
    const status = document.getElementById("cameraModalStatus");
    const scanLine = document.getElementById("scanLine");
    
    modal.style.display = "flex";
    if(scanLine) scanLine.style.opacity = "0";
    status.innerHTML = '<i class="fa-solid fa-spinner fa-spin" style="margin-right:8px"></i>KAMERA AÇILIYOR...';
    
    try {
        if(quaggaActive) { Quagga.stop(); quaggaActive = false; }
        if(currentStream) { currentStream.getTracks().forEach(t => t.stop()); currentStream = null; }
        
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } }
        });
        
        video.srcObject = stream;
        currentStream = stream;
        await video.play();
        
        Quagga.init({
            inputStream: {
                name: "LiveStream",
                type: "LiveStream",
                target: video,
                constraints: { width: 640, height: 480 }
            },
            locator: { patchSize: "medium", halfSample: true },
            numOfWorkers: 2,
            decoder: { readers: ["ean_reader", "ean_8_reader", "upc_reader", "code_128_reader"] },
            locate: true,
            frequency: 10
        }, (err) => {
            if(err) {
                status.innerHTML = '<i class="fa-solid fa-triangle-exclamation" style="margin-right:6px"></i>KAMERA HATASI';
                console.error(err);
                return;
            }
            Quagga.start();
            quaggaActive = true;
            status.innerHTML = '<i class="fa-solid fa-barcode" style="margin-right:6px"></i>BARKODU GÖSTERİN';
            if(scanLine) scanLine.style.opacity = "1";
        });
        
        let lastCode = null;
        let lastTime = 0;
        let locked = false;
        
        Quagga.offDetected();
        Quagga.onDetected((data) => {
            if(locked) return;
            const code = data.codeResult.code;
            if(!code || code.length < 4) return;
            
            const now = Date.now();
            if(code === lastCode && now - lastTime < 500) return;
            lastCode = code;
            lastTime = now;
            
            locked = true;
            playBeep();
            status.innerHTML = '<i class="fa-solid fa-check" style="margin-right:6px"></i>BARKOD OKUNDU!';
            
            setTimeout(() => {
                closeCameraModal();
                
                if(mode === 'search') {
                    const found = findByBarcode(code);
                    if(found) {
                        showResult(found);
                    } else {
                        document.getElementById("resultArea").innerHTML = `
                            <div style="padding:16px;">
                                <div style="font-size:1.2rem;margin-bottom:8px;">
                                    <i class="fa-solid fa-circle-xmark" style="color:#ef4444;margin-right:6px"></i>
                                    "${code}" BULUNAMADI
                                </div>
                                <button class="btn btn-primary" onclick="showAddFormForBarcode('${code}')" style="width:100%;margin-top:12px;">
                                    <i class="fa-solid fa-plus" style="margin-right:6px"></i>YENİ ÜRÜN EKLE
                                </button>
                            </div>`;
                    }
                } else {
                    showAddFormForBarcode(code);
                }
            }, 300);
        });
        
    } catch(e) {
        console.error('Kamera hatası:', e);
        status.innerHTML = '<i class="fa-solid fa-triangle-exclamation" style="margin-right:6px"></i>KAMERA İZNİ REDDEDİLDİ';
        setTimeout(() => closeCameraModal(), 2000);
    }
}

function closeCameraModal() {
    if(quaggaActive) { Quagga.stop(); quaggaActive = false; }
    if(currentStream) { currentStream.getTracks().forEach(t => t.stop()); currentStream = null; }
    document.getElementById("cameraModal").style.display = "none";
    document.getElementById("scanLine").style.opacity = "0";
}

async function addImageToProduct(source) {
    const input = document.createElement("input");
    input.type = "file";
    input.accept = "image/*";
    if(source === 'camera') input.capture = "environment";
    input.onchange = async (e) => {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = async (ev) => {
            products[currentEditingProductId].image = await compressImage(ev.target.result);
            await saveProducts();
            openProductDetailModal(currentEditingProductId);
            playBeep();
        };
        reader.readAsDataURL(file);
    };
    input.click();
}

async function compressImage(dataUrl, w = 400, q = 0.4) {
    return new Promise(r => {
        const img = new Image();
        img.onload = () => {
            const cnv = document.createElement('canvas');
            let ww = img.width, hh = img.height;
            if(ww > w) { hh = hh * w / ww; ww = w; }
            cnv.width = ww; cnv.height = hh;
            cnv.getContext('2d').drawImage(img, 0, 0, ww, hh);
            r(cnv.toDataURL('image/jpeg', q));
        };
        img.src = dataUrl;
    });
}

        products[existing] = {...products[existing], barcode, name, price, quantity, expiry};
    } else {
        products.push({barcode, name, price, quantity, expiry, image: null, id: Date.now(), category: "Dolap Urunleri"});
    }
    
    await saveProducts();
    closeAddForm();
    updateUI();
    showToast(`Ürün kaydedildi: ${name}`);
    playBeep();
}

function closeAddForm() {
    const c = document.getElementById("addFormContainer");
    if(c) { c.classList.add("hidden"); c.innerHTML = ""; }
}

// ============ ETİKET LİSTESİ ============
function addToPrintQueue(product) {
    if(!product || !product.id) return;
    printQueue.push(product.id);
    saveMetadata('printQueue', printQueue);
    showToast(`${product.name} etiket listesine eklendi`);
}

function managePrintQueue() {
    const c = document.getElementById("queueListContainer");
    if(!printQueue.length) {
        c.innerHTML = "<div style='text-align:center;padding:20px;color:var(--text-secondary);'>Liste boş</div>";
    } else {
        const items = printQueue.map(pid => products.find(p => p.id === pid)).filter(Boolean);
        c.innerHTML = items.map((p, i) => `
            <div style="background:rgba(224,242,254,0.7);border-radius:40px;padding:12px 16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;">
                <span style="font-weight:600;">${escapeHtml(p.name)} (${p.price.toFixed(2)}€)</span>
                <button onclick="removeFromQueue(${i})" style="background:#ef4444;border:none;border-radius:30px;padding:6px 14px;color:white;cursor:pointer;"><i class="fa-solid fa-xmark"></i></button>
            </div>`).join('');
    }
    document.getElementById("queueModal").style.display = "flex";
}

function removeFromQueue(i) {
    printQueue.splice(i, 1);
    saveMetadata('printQueue', printQueue);
    managePrintQueue();
}

function clearPrintQueue() {
    if(confirm("Etiket listesi temizlensin mi?")) {
        printQueue = [];
        saveMetadata('printQueue', printQueue);
        managePrintQueue();
    }
}

function closeQueueModal() {
    document.getElementById("queueModal").style.display = "none";
}

// ============ STOK SAYIM ============
function openStokSayimModal() {
    document.getElementById("stokSayimModal").style.display = "flex";
    document.getElementById("sayimSearchInput").value = "";
    renderSayimListe();
}

function closeStokSayimModal() {
    document.getElementById("stokSayimModal").style.display = "none";
}

function renderSayimListe() {
    const s = (document.getElementById('sayimSearchInput')?.value || '').toLowerCase();
    const filtered = products.filter(p => !s || p.name.toLowerCase().includes(s) || p.barcode.includes(s));
    const sorted = [...filtered].sort((a, b) => a.name.localeCompare(b.name));
    const c = document.getElementById('sayimListeItems');
    
    if(!sorted.length) {
        c.innerHTML = '<div style="color:var(--text-secondary);text-align:center;padding:16px">Ürün bulunamadı</div>';
        return;
    }
    
    c.innerHTML = sorted.map(p => `
        <div style="background:rgba(224,242,254,0.65);border-radius:30px;padding:12px 16px;display:flex;align-items:center;gap:10px;margin-bottom:8px;">
            <div style="flex:1;font-size:0.85rem;font-weight:700;">${escapeHtml(p.name)}</div>
            <div style="font-size:0.75rem;color:var(--text-secondary);">Mevcut: ${p.quantity}</div>
            <input type="number" id="sayim_${p.barcode}" placeholder="Yeni" min="0" style="width:70px;padding:10px;text-align:center;border-radius:16px;border:1px solid rgba(0,0,0,0.1);" oninput="updateSayimDiff('${p.barcode}',${p.quantity})">
            <span id="sayimdiff_${p.barcode}" style="min-width:32px;text-align:center;font-weight:800;">—</span>
        </div>`).join('');
}

function updateSayimDiff(bc, mev) {
    const inp = document.getElementById('sayim_' + bc);
    const del = document.getElementById('sayimdiff_' + bc);
    if(!inp || !del) return;
    const v = parseInt(inp.value);
    if(isNaN(v)) { del.innerText = '—'; del.style.color = 'var(--text-secondary)'; return; }
    const d = v - mev;
    if(d > 0) { del.innerText = '+' + d; del.style.color = '#10b981'; }
    else if(d < 0) { del.innerText = String(d); del.style.color = '#ef4444'; }
    else { del.innerText = '✓'; del.style.color = 'var(--text-secondary)'; }
}

async function saveSayimListe() {
    let cnt = 0;
    products.forEach(p => {
        const inp = document.getElementById('sayim_' + p.barcode);
        if(inp && inp.value !== '') {
            const v = parseInt(inp.value);
            if(!isNaN(v) && v >= 0) { p.quantity = v; cnt++; }
        }
    });
    if(!cnt) { showToast('Miktar girilmedi!'); return; }
    await saveProducts();
    updateUI();
    showToast('✅ ' + cnt + ' ürün güncellendi');
    closeStokSayimModal();
}

// ============ YEDEKLEME ============
async function backupData() {
    try {
        const backup = { products, printQueue, tarih: new Date().toISOString() };
        const blob = new Blob([JSON.stringify(backup)], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `MarketPro_Yedek_${new Date().toISOString().slice(0,10)}.json`;
        a.click();
        showToast("Yedek indirildi");
    } catch(e) { showToast("Yedek alınamadı"); }
}

async function restoreData() {
    const input = document.createElement("input");
    input.type = "file";
    input.accept = ".json";
    input.onchange = async (e) => {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = async (ev) => {
            try {
                const data = JSON.parse(ev.target.result);
                if(data.products && Array.isArray(data.products)) {
                    if(confirm(`${data.products.length} ürün yüklenecek. Devam?`)) {
                        products = data.products;
                        printQueue = data.printQueue || [];
                        await saveProducts();
                        updateUI();
                        showToast("Yedek yüklendi!");
                    }
                } else {
                    showToast("Geçersiz dosya!");
                }
            } catch(err) { showToast("Dosya okunamadı!"); }
        };
        reader.readAsText(file);
    };
    input.click();
}

// ============ CSV RAPORU ============
function exportToCSV() {
    if(!products.length) { showToast("Envanter boş!"); return; }
    let csv = "\uFEFFBarkod,Ürün Adı,Fiyat,Stok,SKT\n";
    products.forEach(p => {
        csv += `${p.barcode},"${p.name}",${p.price},${p.quantity},${p.expiry || ''}\n`;
    });
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `MarketPro_Rapor_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
    showToast("CSV raporu indirildi");
}
